# Production overrides. Activate with SPRING_PROFILES_ACTIVE=prod.
# All credentials/secrets must be supplied from a secret manager or protected environment.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
# Webhooks must use TLS in production.
workflow.webhooks.require-https=${WORKFLOW_WEBHOOKS_REQUIRE_HTTPS:true}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
# API documentation is disabled by default in production; enable only on a protected internal deployment.
springdoc.api-docs.enabled=${WORKFLOW_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${WORKFLOW_API_DOCS_ENABLED:false}
