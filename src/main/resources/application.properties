
spring.application.name=workflow-engine

server.port=8081

# Workflow engine database
spring.datasource.url=${WORKFLOW_DB_URL:jdbc:postgresql://localhost:5432/workflow_engine_db}
spring.datasource.username=${WORKFLOW_DB_USERNAME:workflow_service_user}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA: Flyway manages database schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Database migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Health endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never


# Never expose exception internals in HTTP error responses.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Actuator health groups for container/orchestrator probes.
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-components=never
# management.endpoint.health.show-details=never

# Conservative connection-pool defaults; override for measured deployment load.
spring.datasource.hikari.maximum-pool-size=${WORKFLOW_DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${WORKFLOW_DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${WORKFLOW_DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.validation-timeout=${WORKFLOW_DB_VALIDATION_TIMEOUT_MS:5000}

# Credentials and secrets come only from the environment or a secret manager.
# See .env.example for the variable names. Never write real values here.
spring.datasource.password=${WORKFLOW_DB_PASSWORD}
# Administrator account: manages roles, subject types and workflow definitions.
workflow.security.admin-username=${WORKFLOW_ADMIN_USERNAME}
workflow.security.admin-password=${WORKFLOW_ADMIN_PASSWORD}
# Service account: used by the calling system's backend.
workflow.security.service-username=${WORKFLOW_SERVICE_USERNAME}
workflow.security.service-password=${WORKFLOW_SERVICE_PASSWORD}
# Shared HMAC secret (at least 32 random characters) for X-Actor-Signature.
workflow.security.actor-signing-secret=${WORKFLOW_ACTOR_SIGNING_SECRET}